name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: [~1.26, stable]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race ./...

  # Run after a failed matrix so branch protection sees a failure, not a skip.
  test-status:
    runs-on: ubuntu-slim
    needs: [test]
    if: ${{ always() }}
    steps:
      - run: test "${{ needs.test.result }}" = success
