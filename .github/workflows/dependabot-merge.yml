name: Dependabot Merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Turns on auto-merge for Dependabot PRs, so they squash into main once the
  # required checks pass. Needs "Allow auto-merge" in the repository settings.
  dependabot:
    runs-on: ubuntu-slim
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.draft == false
      && github.event.pull_request.state == 'open'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
