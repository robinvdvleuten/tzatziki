name: govulncheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: govulncheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # With SARIF output govulncheck exits 0 whatever it finds: the findings
      # show up under code scanning rather than failing this job.
      - run: govulncheck -C . -format sarif ./... > results.sarif
      # govulncheck repeats rule tags and call stacks, which upload-sarif
      # rejects as duplicate items.
      - if: always()
        run: |
          jq '(.runs[].tool.driver.rules // [])[] |= (.properties.tags |= unique)
            | (.runs[].results // [])[] |= (if .stacks then .stacks |= unique else . end)' \
            results.sarif > results-fixed.sarif
          mv results-fixed.sarif results.sarif
      - uses: github/codeql-action/upload-sarif@v4.39.3
        if: always()
        with:
          sarif_file: results.sarif
