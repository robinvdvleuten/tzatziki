name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Fails a PR that adds a dependency with a critical advisory or a license
  # outside .github/dependency-review.yml.
  dependency-review:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
        with:
          config-file: ./.github/dependency-review.yml
