name: Fuzz

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # A short run of each target: it replays the seeds and finds shallow crashers.
  # Time zone definitions in invites are written by strangers.
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzToLocation, FuzzFromLocation]
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 30s -fuzzminimizetime 1m .
      # The failing input, to reproduce with: go test -run <target>/<name>
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: crasher-${{ matrix.target }}
          path: testdata/fuzz/
